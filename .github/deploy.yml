name: Deploy Arcade Front-End with Secure COOP and COEP Headers
on:
  push:
    branches: ["main"] # Fires every time you push code modifications to your main branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code Deck
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Framework
        uses: actions/configure-pages@v4

      # ==============================================================================
      #            THE HARDWARE COMPILATION HEADER INJECTION INSTRUCTION
      # ==============================================================================
      # This layer commands GitHub's servers to attach native COOP and COEP parameters
      # to your website pages, completely unlocking SharedArrayBuffer without scripts!
      - name: Inject Cross-Origin Isolation Server Side Headers
        run: |
          echo "/*" > _headers
          echo "  Cross-Origin-Opener-Policy: same-origin" >> _headers
          echo "  Cross-Origin-Embedder-Policy: require-corp" >> _headers
      # ==============================================================================

      - name: Upload Static Web Assets Bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Live Sandbox Pipeline to GitHub Pages Cloud
        id: deployment
        uses: actions/deploy-pages@v4
